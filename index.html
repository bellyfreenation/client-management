<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Belly Free Nation — Client Management</title>
<style>
  :root { --green:#11562F; --navy:#1B3A4B; --cream:#F6F3EC; --paper:#FFFcf7; --ink:#1A2421; --muted:#5E6B66; --line:#E4DDD0; --nv:#C94C4C; --warn:#8A5A12; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", Arial, sans-serif; background:var(--cream); color:var(--ink); }
  header.top { background:#F7F4EE; border-bottom:3px solid var(--green); padding:12px 22px 10px; }
  .brand { display:flex; gap:18px; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; }
  .mark { color:#11562F; font-weight:700; line-height:0.9; font-size:34px; }
  .mark .b { display:inline-block; font-weight:800; color:#F4EFE4; background:#11562F; border-radius:8px; padding:0 7px 2px; }
  .mark .nation { font-size:13px; letter-spacing:0.42em; margin:4px 0 0 46px; }
  .brand .screen { margin:0; color:var(--green); font-size:13px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase; }
  .wrap { max-width:1100px; margin:0 auto; padding:18px 16px 48px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button, .btn, .btn-ghost { border:0; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .tabs button { background:transparent; color:var(--navy); border:1px solid var(--line); }
  .tabs button.on, .btn { background:var(--green); color:#fff; border-color:var(--green); }
  .btn-ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  input, select, textarea { width:100%; border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink); }
  textarea { min-height:72px; }
  label { display:block; font-size:12px; font-weight:700; color:var(--navy); margin-bottom:4px; }
  label span.req { color:var(--nv); }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid .full { grid-column:1 / -1; }
  .search { flex:1; min-width:180px; }
  .client { display:grid; grid-template-columns:1.4fr .8fr .6fr .7fr auto; gap:8px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .name { font-weight:800; color:var(--navy); }
  .pill { display:inline-block; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:800; }
  .pill.veg, .pill.on { background:#E7F3EA; color:var(--green); }
  .pill.nv { background:#FBEAEA; color:var(--nv); }
  .pill.off { background:#F3EFE6; color:var(--warn); }
  .hide { display:none !important; }
  .savebar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; }
  .flash { color:var(--green); font-size:13px; font-weight:700; }
  .kcal-note { font-size:12px; color:var(--muted); margin:6px 0 10px; }
  .days { display:flex; gap:6px; flex-wrap:wrap; }
  .day { border:1px solid var(--line); background:#fff; border-radius:8px; min-width:64px; padding:6px 8px; text-align:center; cursor:pointer; font-family:inherit; }
  .day b { display:block; font-size:11px; color:var(--navy); }
  .day.on-veg { background:#E7F3EA; border-color:var(--green); color:var(--green); }
  .day.on-nv { background:#FBEAEA; border-color:var(--nv); color:var(--nv); }
  .day span { font-size:11px; font-weight:800; }
  .deliver-grid { display:grid; grid-template-columns:52px 1fr 1fr; gap:6px; align-items:center; margin-top:6px; }
  .deliver-grid input { padding:8px; }
  .logtable { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  .logtable th { background:var(--navy); color:#fff; font-size:12px; text-align:left; padding:8px; }
  .logtable td { border-top:1px solid var(--line); padding:6px 8px; font-size:14px; vertical-align:middle; }
  .logtable input[type="number"], .logtable input[type="text"] { width:64px; padding:4px 6px; font-size:13px; }
  .chip { border:0; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:800; cursor:pointer; }
  .chip.veg { background:#E7F3EA; color:var(--green); }
  .chip.nv { background:#FBEAEA; color:var(--nv); }
  .outbar { margin-top:10px; background:#FBEAEA; color:var(--nv); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:750; }
  .empty { padding:28px 8px; text-align:center; color:var(--muted); }
  @media (max-width:800px) { .grid, .client { grid-template-columns:1fr; } .logtable { display:block; overflow-x:auto; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark"><span class="b">B</span>elly free<div class="nation">NATION</div></div>
    <p class="screen">Client Management</p>
  </div>
</header>
<main class="wrap">
  <div class="tabs">
    <button id="tabClients" class="on" type="button">Clients</button>
    <button id="tabLog" type="button">Daily Log</button>
  </div>
  <section id="clientsView">
    <div class="row">
      <button class="btn" id="addBtn" type="button">+ Add Client</button>
      <input class="search" id="q" placeholder="Search name, WhatsApp, restriction" />
      <button class="btn-ghost" id="backupBtn" type="button">Download backup</button>
      <button class="btn-ghost" id="restoreBtn" type="button">Restore backup</button>
      <input id="restoreFile" type="file" accept="application/json,.json" class="hide" />
    </div>
    <p class="kcal-note" id="backupNote">Backup is a file you keep. GitHub does not store the client list.</p>
    <div id="formCard" class="card hide">
      <h2 id="formTitle" style="margin:0 0 12px; color:var(--navy); font-size:18px;">Client Details</h2>
      <div class="grid">
        <div><label>Client Name <span class="req">*</span></label><input id="fName" /></div>
        <div><label>WhatsApp</label><input id="fPhone" placeholder="Optional" /></div>
        <div><label>Start Date <span class="req">*</span></label><input id="fStart" type="date" /></div>
        <div><label>End Date</label><input id="fEnd" type="date" /></div>
        <div><label>Calories <span class="req">*</span></label><input id="fKcal" type="number" min="0" step="10" value="700" /></div>
        <div><label>Protein Target (g)</label><input id="fProtein" type="number" min="0" step="1" /></div>
        <div class="full">
          <label>Veg / Non-Veg days</label>
          <div class="row">
            <button class="btn-ghost" type="button" id="setNv">All non-veg</button>
            <button class="btn-ghost" type="button" id="setVeg">All veg</button>
            <button class="btn-ghost" type="button" id="setMon">Monday veg</button>
            <button class="btn-ghost" type="button" id="setMonThu">Mon + Thu veg</button>
          </div>
          <div class="days" id="dayRow"></div>
        </div>
        <div class="full">
          <label>Meals by day</label>
          <div class="row">
            <button class="btn-ghost" type="button" id="setBoth">Both every day</button>
            <button class="btn-ghost" type="button" id="setTueDinner">Tuesday dinner only</button>
          </div>
          <div class="days" id="mealRow"></div>
          <p class="kcal-note">Tap a day to cycle Both, Lunch, Dinner, Off.</p>
        </div>
        <div><label>Lunch deliver</label><input id="fLunchWindow" value="11:00–12:00" /></div>
        <div><label>Dinner deliver</label><input id="fDinnerWindow" value="6:00–7:00" /></div>
        <div class="full">
          <label>Early delivery by day</label>
          <div class="row">
            <button class="btn-ghost" type="button" id="setStandard">Clear early times</button>
            <button class="btn-ghost" type="button" id="setMon5">Monday dinner 5:00</button>
            <button class="btn-ghost" type="button" id="setThuFri445">Thu Fri dinner 4:45</button>
            <button class="btn-ghost" type="button" id="setThuSat445">Thu Fri Sat dinner 4:45</button>
          </div>
          <div id="deliverRow"></div>
          <p class="kcal-note">Type a time only when it is not 11–12 or 6–7. Blank means the regular window.</p>
        </div>
        <div><label>Active / Paused</label><select id="fStatus"><option>Active</option><option>Paused</option></select></div>
        <div><label>Payment Status</label><select id="fPay"><option>Unbilled</option><option>Current</option><option>Due</option><option>Paused</option></select></div>
        <div class="full"><label>Food Restrictions</label><input id="fRestrict" /></div>
        <div class="full"><label>Allergies</label><input id="fAllergy" /></div>
        <div><label>Meal Timing</label><input id="fTiming" placeholder="Lunch 11–12 · Dinner 6–7" /></div>
        <div class="full"><label>Delivery Address</label><textarea id="fAddress" placeholder="Paste a Google Maps link or the address"></textarea></div>
        <div class="full"><label>Notes</label><textarea id="fNotes"></textarea></div>
      </div>
      <div class="savebar">
        <span id="formMsg" class="flash"></span>
        <div>
          <button class="btn-ghost" id="cancelBtn" type="button">Cancel</button>
          <button class="btn" id="saveBtn" type="button">Save Client</button>
        </div>
      </div>
    </div>
    <div class="card"><strong id="countLabel">0 clients</strong><div id="list"></div></div>
  </section>
  <section id="logView" class="hide">
    <div class="row">
      <button class="btn-ghost" id="prevDay" type="button">Prev</button>
      <input id="logDate" type="date" style="max-width:180px;" />
      <button class="btn-ghost" id="nextDay" type="button">Next</button>
      <button class="btn" id="downloadLog" type="button">Download daily log</button>
      <span id="logMsg" class="flash"></span>
    </div>
    <div id="logList"></div>
  </section>
</main>
<script>
const KEY = "bfn_client_os_v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MEAL_CYCLE = ["Both","Lunch","Dinner","Off"];
const state = load();
let editId = null;
let dayPick = blankDays("Non-Veg");
let mealPick = blankMeals("Both");
let deliverPick = blankDeliver();
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{"clients":[],"logs":{}}'); } catch (e) { return { clients: [], logs: {} }; } }
function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function today() { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function shift(iso, n) { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function activeClients() { return state.clients.filter(c => c.status !== "Paused"); }
function blankDays(mode) { const d = {}; DAYS.forEach(k => d[k] = mode || "Non-Veg"); return d; }
function blankMeals(mode) { const d = {}; DAYS.forEach(k => d[k] = mode || "Both"); return d; }
function blankDeliver() { const d = {}; DAYS.forEach(k => d[k] = { lunch:"", dinner:"" }); return d; }
function dayKey(iso) { return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(iso+"T12:00:00").getDay()]; }
function esc(s) { return String(s||"").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch])); }
function paintDays() {
  document.getElementById("dayRow").innerHTML = DAYS.map(k => '<button type="button" class="day '+(dayPick[k]==="Veg"?"on-veg":"on-nv")+'" data-day="'+k+'"><b>'+k+'</b><span>'+(dayPick[k]==="Veg"?"Veg":"Non-Veg")+'</span></button>').join("");
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { dayPick[b.dataset.day] = dayPick[b.dataset.day]==="Veg" ? "Non-Veg" : "Veg"; paintDays(); });
}
function setDays(map) { dayPick = Object.assign(blankDays("Non-Veg"), map || {}); paintDays(); }
function paintMeals() {
  document.getElementById("mealRow").innerHTML = DAYS.map(k => '<button type="button" class="day '+(mealPick[k]==="Off"?"on-nv":"on-veg")+'" data-mealday="'+k+'"><b>'+k+'</b><span>'+mealPick[k]+'</span></button>').join("");
  document.querySelectorAll("[data-mealday]").forEach(b => b.onclick = () => { const now = mealPick[b.dataset.mealday] || "Both"; mealPick[b.dataset.mealday] = MEAL_CYCLE[(MEAL_CYCLE.indexOf(now)+1) % MEAL_CYCLE.length]; paintMeals(); });
}
function setMeals(map) { mealPick = Object.assign(blankMeals("Both"), map || {}); paintMeals(); }
function paintDeliver() {
  const host = document.getElementById("deliverRow");
  host.innerHTML = '<div class="deliver-grid"><span></span><label>Lunch time</label><label>Dinner time</label></div>' + DAYS.map(k => '<div class="deliver-grid"><b>'+k+'</b><input data-dtime="'+k+'" data-dmeal="lunch" placeholder="11–12" value="'+esc(deliverPick[k].lunch||"")+'" /><input data-dtime="'+k+'" data-dmeal="dinner" placeholder="6–7" value="'+esc(deliverPick[k].dinner||"")+'" /></div>').join("");
  host.querySelectorAll("[data-dtime]").forEach(el => el.oninput = () => { deliverPick[el.dataset.dtime][el.dataset.dmeal] = el.value.trim(); });
}
function setDeliver(map) {
  deliverPick = blankDeliver();
  DAYS.forEach(k => {
    const raw = map && map[k];
    if (!raw) return;
    if (typeof raw === "string") { deliverPick[k].dinner = raw.replace(/lunch|dinner/ig, "").trim(); return; }
    deliverPick[k] = { lunch: raw.lunch || "", dinner: raw.dinner || "" };
  });
  paintDeliver();
}
function dietSummary(days) {
  const d = Object.assign(blankDays("Non-Veg"), days || {});
  const veg = DAYS.filter(k => d[k]==="Veg");
  if (!veg.length) return "Non-veg every day";
  if (veg.length === 7) return "Veg every day";
  return veg.join(" ") + " veg";
}
function dietOn(days, iso) { return Object.assign(blankDays("Non-Veg"), days || {})[dayKey(iso)]; }
function wantsMeal(meals, iso, meal) {
  const mode = Object.assign(blankMeals("Both"), meals || {})[dayKey(iso)];
  if (mode === "Off") return false;
  if (mode === "Lunch") return meal === "lunch";
  if (mode === "Dinner") return meal === "dinner";
  return true;
}
function mealDiet(c, e, date, meal) {
  if (e[meal + "DietManual"] && e[meal + "Diet"]) return e[meal + "Diet"];
  return dietOn(c.days, date);
}
function cardTime(c, date, meal) {
  const hit = Object.assign(blankDeliver(), c.deliver || {})[dayKey(date)] || { lunch:"", dinner:"" };
  if (meal === "lunch") return hit.lunch || c.lunchWindow || "11:00–12:00";
  return hit.dinner || c.dinnerWindow || "6:00–7:00";
}
function shownTime(c, e, date, meal) {
  if (e[meal + "TimeManual"] && e[meal + "Time"]) return e[meal + "Time"];
  return cardTime(c, date, meal);
}
function dayLog(date) { if (!state.logs[date]) state.logs[date] = {}; return state.logs[date]; }
function entryFor(date, c) {
  const full = state.clients.find(x => x.id === c.id) || c;
  const log = dayLog(date);
  if (!log[full.id]) log[full.id] = { lunch:false, lunchKcal:full.calories, dinner:false, dinnerKcal:full.calories, manual:false };
  const e = log[full.id];
  if (!e.manual) {
    e.lunch = wantsMeal(full.meals, date, "lunch");
    e.dinner = wantsMeal(full.meals, date, "dinner");
    e.lunchKcal = full.calories;
    e.dinnerKcal = full.calories;
  }
  return e;
}
function renderLog() {
  const date = document.getElementById("logDate").value || today();
  document.getElementById("logDate").value = date;
  const people = activeClients();
  const host = document.getElementById("logList");
  if (!people.length) { host.innerHTML = '<div class="card empty">No active clients.</div>'; return; }
  const rows = people.map(c => {
    const e = entryFor(date, c);
    const ld = mealDiet(c, e, date, "lunch");
    const dd = mealDiet(c, e, date, "dinner");
    return '<tr><td class="name">'+esc(c.name)+'</td><td><input type="checkbox" data-meal="'+c.id+'" data-key="lunch"'+(e.lunch?' checked':'')+' /></td><td><button type="button" class="chip '+(ld==="Veg"?"veg":"nv")+'" data-mdiet="'+c.id+'" data-which="lunch">'+ld+'</button></td><td><input type="number" min="0" step="10" data-kcal="'+c.id+'" data-key="lunch" value="'+e.lunchKcal+'" /></td><td><input type="text" data-time="'+c.id+'" data-which="lunch" value="'+esc(shownTime(c, e, date, "lunch"))+'" /></td><td><input type="checkbox" data-meal="'+c.id+'" data-key="dinner"'+(e.dinner?' checked':'')+' /></td><td><button type="button" class="chip '+(dd==="Veg"?"veg":"nv")+'" data-mdiet="'+c.id+'" data-which="dinner">'+dd+'</button></td><td><input type="number" min="0" step="10" data-kcal="'+c.id+'" data-key="dinner" value="'+e.dinnerKcal+'" /></td><td><input type="text" data-time="'+c.id+'" data-which="dinner" value="'+esc(shownTime(c, e, date, "dinner"))+'" /></td></tr>';
  }).join("");
  const outL = people.filter(c => !entryFor(date, c).lunch).map(c => c.name);
  const outD = people.filter(c => !entryFor(date, c).dinner).map(c => c.name);
  host.innerHTML = '<table class="logtable"><thead><tr><th>Name</th><th>Lunch</th><th>Veg</th><th>kcal</th><th>time</th><th>Dinner</th><th>Veg</th><th>kcal</th><th>time</th></tr></thead><tbody>'+rows+'</tbody></table><div class="outbar">OUT LUNCH: '+(outL.length?esc(outL.join(", ")):"none")+'<br>OUT DINNER: '+(outD.length?esc(outD.join(", ")):"none")+'</div>';
  persist();
  host.querySelectorAll("[data-meal]").forEach(el => el.onchange = ev => { const e = entryFor(date,{id:ev.target.dataset.meal}); e[ev.target.dataset.key] = ev.target.checked; e.manual = true; persist(); renderLog(); });
  host.querySelectorAll("[data-mdiet]").forEach(el => el.onclick = ev => { const id = ev.target.dataset.mdiet, which = ev.target.dataset.which; const client = state.clients.find(x => x.id === id) || {}; const e = entryFor(date, { id:id }); e[which+"Diet"] = mealDiet(client, e, date, which) === "Veg" ? "Non-Veg" : "Veg"; e[which+"DietManual"] = true; persist(); renderLog(); });
  host.querySelectorAll("[data-kcal]").forEach(el => el.oninput = ev => { const e = entryFor(date,{id:ev.target.dataset.kcal}); e[ev.target.dataset.key+"Kcal"] = Number(ev.target.value||0); e.manual = true; persist(); });
  host.querySelectorAll("[data-time]").forEach(el => el.onchange = ev => { const e = entryFor(date,{id:ev.target.dataset.time}); e[ev.target.dataset.which+"Time"] = ev.target.value.trim(); e[ev.target.dataset.which+"TimeManual"] = true; persist(); document.getElementById("logMsg").textContent = "Time saved for this date only."; });
}
function downloadLog() {
  const date = document.getElementById("logDate").value || today();
  const people = activeClients();
  const outL = people.filter(c => !entryFor(date, c).lunch).map(c => c.name);
  const outD = people.filter(c => !entryFor(date, c).dinner).map(c => c.name);
  const rows = [["OUT LUNCH", outL.length ? outL.join(", ") : "none"], ["OUT DINNER", outD.length ? outD.join(", ") : "none"], [], ["Name","Lunch","Lunch kcal","Lunch time","Dinner","Dinner kcal","Dinner time"]];
  people.forEach(c => { const e = entryFor(date, c); rows.push([c.name, e.lunch ? mealDiet(c, e, date, "lunch") : "Off", e.lunch ? e.lunchKcal : "", e.lunch ? shownTime(c, e, date, "lunch") : "", e.dinner ? mealDiet(c, e, date, "dinner") : "Off", e.dinner ? e.dinnerKcal : "", e.dinner ? shownTime(c, e, date, "dinner") : ""]); });
  const csv = rows.map(r => r.map(v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = "BFN_Daily_Log_" + date + ".csv";
  a.click();
  document.getElementById("logMsg").textContent = "Daily log downloaded for " + date + ".";
}
function show(which) {
  document.getElementById("clientsView").classList.toggle("hide", which!=="clients");
  document.getElementById("logView").classList.toggle("hide", which!=="log");
  document.getElementById("tabClients").classList.toggle("on", which==="clients");
  document.getElementById("tabLog").classList.toggle("on", which==="log");
  if (which==="log") renderLog();
}
function openForm(c) {
  editId = c ? c.id : null;
  document.getElementById("formTitle").textContent = c ? "Edit Client" : "Client Details";
  document.getElementById("fName").value = c ? c.name : "";
  document.getElementById("fPhone").value = c ? (c.phone||"") : "";
  document.getElementById("fStart").value = c ? c.start : today();
  document.getElementById("fEnd").value = c ? (c.end||"") : "";
  document.getElementById("fKcal").value = c ? c.calories : 700;
  document.getElementById("fProtein").value = c ? (c.protein||"") : "";
  setDays(c && c.days ? c.days : blankDays("Non-Veg"));
  setMeals(c && c.meals ? c.meals : blankMeals("Both"));
  setDeliver(c && c.deliver ? c.deliver : {});
  document.getElementById("fLunchWindow").value = c && c.lunchWindow ? c.lunchWindow : "11:00–12:00";
  document.getElementById("fDinnerWindow").value = c && c.dinnerWindow ? c.dinnerWindow : "6:00–7:00";
  document.getElementById("fStatus").value = c ? c.status : "Active";
  document.getElementById("fPay").value = c ? (c.payment||"Unbilled") : "Unbilled";
  document.getElementById("fRestrict").value = c ? (c.restrictions||"") : "";
  document.getElementById("fAllergy").value = c ? (c.allergies||"") : "";
  document.getElementById("fTiming").value = c ? (c.timing||"") : "";
  document.getElementById("fAddress").value = c ? (c.address||"") : "";
  document.getElementById("fNotes").value = c ? (c.notes||"") : "";
  document.getElementById("formCard").classList.remove("hide");
}
function closeForm() { editId = null; document.getElementById("formCard").classList.add("hide"); }
function saveClient() {
  const name = document.getElementById("fName").value.trim();
  const start = document.getElementById("fStart").value;
  const calories = Number(document.getElementById("fKcal").value);
  const msg = document.getElementById("formMsg");
  if (!name || !start || !calories) { msg.textContent = "Name, start date, and calories are required."; msg.style.color = "var(--nv)"; return; }
  const rec = { id: editId || uid(), name, phone: document.getElementById("fPhone").value.trim(), start, end: document.getElementById("fEnd").value, calories, protein: document.getElementById("fProtein").value, days: Object.assign(blankDays("Non-Veg"), dayPick), meals: Object.assign(blankMeals("Both"), mealPick), deliver: JSON.parse(JSON.stringify(deliverPick)), lunchWindow: document.getElementById("fLunchWindow").value.trim() || "11:00–12:00", dinnerWindow: document.getElementById("fDinnerWindow").value.trim() || "6:00–7:00", diet: dietSummary(dayPick), status: document.getElementById("fStatus").value, payment: document.getElementById("fPay").value, restrictions: document.getElementById("fRestrict").value.trim(), allergies: document.getElementById("fAllergy").value.trim(), timing: document.getElementById("fTiming").value.trim(), address: document.getElementById("fAddress").value.trim(), notes: document.getElementById("fNotes").value.trim() };
  if (editId) { const i = state.clients.findIndex(c => c.id === editId); if (i>=0) state.clients[i] = rec; } else state.clients.push(rec);
  persist(); renderList(); closeForm();
}
function removeClient(id) {
  const c = state.clients.find(x => x.id === id);
  if (!c || !confirm("Remove " + c.name + "?")) return;
  state.clients = state.clients.filter(x => x.id !== id); persist(); renderList();
}
function renderList() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = state.clients.filter(c => [c.name,c.phone,c.restrictions,c.allergies].join(" ").toLowerCase().includes(q));
  document.getElementById("countLabel").textContent = state.clients.length + " clients · " + activeClients().length + " active";
  const host = document.getElementById("list");
  if (!rows.length) { host.innerHTML = '<div class="empty">No clients yet.</div>'; return; }
  host.innerHTML = rows.map(c => '<div class="client"><div><div class="name">'+esc(c.name)+'</div></div><div><span class="pill '+(dietSummary(c.days)==="Non-veg every day"?"nv":"veg")+'">'+esc(dietSummary(c.days))+'</span></div><div><b>'+c.calories+'</b> kcal</div><div><span class="pill '+(c.status==="Active"?"on":"off")+'">'+esc(c.status)+'</span></div><div><button class="btn-ghost" data-edit="'+c.id+'" type="button">Edit</button> <button class="btn-ghost" data-del="'+c.id+'" type="button">Remove</button></div></div>').join("");
  host.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openForm(state.clients.find(c => c.id === b.dataset.edit)));
  host.querySelectorAll("[data-del]").forEach(b => b.onclick = () => removeClient(b.dataset.del));
}
function downloadBackup() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ exported:new Date().toISOString(), clients:state.clients, logs:state.logs }, null, 2)], { type:"application/json" }));
  a.download = "BFN_Clients_backup_" + today() + ".json";
  a.click();
  document.getElementById("backupNote").textContent = "Backup downloaded " + today() + ". Keep that file in Drive.";
}
function restoreBackup(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.clients)) throw new Error("bad");
      if (!confirm("Replace the clients and daily log in this browser with this backup?")) return;
      state.clients = data.clients; state.logs = data.logs || {}; persist(); renderList();
    } catch (e) { alert("That file is not a Belly Free Nation backup."); }
    ev.target.value = "";
  };
  reader.readAsText(file);
}
document.getElementById("tabClients").onclick = () => show("clients");
document.getElementById("tabLog").onclick = () => show("log");
document.getElementById("addBtn").onclick = () => openForm(null);
document.getElementById("cancelBtn").onclick = closeForm;
document.getElementById("saveBtn").onclick = saveClient;
document.getElementById("backupBtn").onclick = downloadBackup;
document.getElementById("restoreBtn").onclick = () => document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange = restoreBackup;
document.getElementById("setNv").onclick = () => setDays(blankDays("Non-Veg"));
document.getElementById("setVeg").onclick = () => setDays(blankDays("Veg"));
document.getElementById("setMon").onclick = () => setDays({Mon:"Veg"});
document.getElementById("setMonThu").onclick = () => setDays({Mon:"Veg",Thu:"Veg"});
document.getElementById("setBoth").onclick = () => setMeals(blankMeals("Both"));
document.getElementById("setTueDinner").onclick = () => setMeals({Tue:"Dinner"});
document.getElementById("setStandard").onclick = () => setDeliver({});
document.getElementById("setMon5").onclick = () => setDeliver({Mon:{dinner:"5:00"}});
document.getElementById("setThuFri445").onclick = () => setDeliver({Thu:{dinner:"4:45"},Fri:{dinner:"4:45"}});
document.getElementById("setThuSat445").onclick = () => setDeliver({Thu:{dinner:"4:45"},Fri:{dinner:"4:45"},Sat:{dinner:"4:45"}});
document.getElementById("q").oninput = renderList;
document.getElementById("logDate").value = today();
document.getElementById("logDate").onchange = renderLog;
document.getElementById("prevDay").onclick = () => { document.getElementById("logDate").value = shift(document.getElementById("logDate").value,-1); renderLog(); };
document.getElementById("nextDay").onclick = () => { document.getElementById("logDate").value = shift(document.getElementById("logDate").value,1); renderLog(); };
document.getElementById("downloadLog").onclick = downloadLog;
renderList();
</script>
</body>
</html>
